<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@TITLE@</title>
<style>
body{font-family:-apple-system,Helvetica,Arial,sans-serif;background:#1c1c1e;color:#fff;margin:0;padding:24px;text-align:center}
h1{font-size:20px}
p{color:#c7c7cc}
input{margin-top:16px;color:#fff;max-width:100%}
button{background:#0a84ff;color:#fff;border:0;border-radius:12px;font-size:17px;padding:14px 28px;margin-top:18px}
#p{max-width:100%;max-height:50vh;margin-top:16px;border-radius:12px}
#s{margin-top:16px;font-size:16px}
</style></head><body>
<h1>@TITLE@</h1>
<p>@HINT@</p>
<input type="file" id="f" accept="image/*">
<div><img id="p"></div>
<button onclick="send()">@BTN@</button>
<div id="s"></div>
<script>
var f=document.getElementById('f');
f.onchange=function(){var x=f.files[0];if(x){document.getElementById('p').src=URL.createObjectURL(x);}};
function send(){
  var x=f.files[0];
  if(!x){alert('@PICK@');return;}
  var s=document.getElementById('s');
  s.innerText='...';
  var r=new XMLHttpRequest();
  r.open('POST','/@TOKEN@/up');
  r.onload=function(){s.innerText=(r.status==200)?'@DONE@':'@ERR@';};
  r.onerror=function(){s.innerText='@ERR@';};
  r.send(x);
}
</script></body></html>
